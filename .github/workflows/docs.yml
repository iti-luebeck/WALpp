name: Docs

# Builds the documentation (doxide API reference + MkDocs site). The site is
# hosted at https://www.iti.uni-luebeck.de/docs/walpp/ and deployed from the
# institute's GitLab (job docs:deploy in .gitlab-ci.yml); this workflow only
# checks that it builds and attaches the result to the run as the artifact
# "walpp-docs" (contents of build/site).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install doxide
        # Official package repository, see https://indii.org/download/
        run: |
          echo 'deb https://download.indii.org/deb noble main' | sudo tee /etc/apt/sources.list.d/indii.org.list
          curl -fsSL https://download.indii.org/deb/Release.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/indii.org.gpg > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y doxide rsync

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build the playground WebAssembly module
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10

      - name: Build WAL++ for the browser
        run: bash build-wasm.sh

      - name: Fetch the Surfer viewer bundle
        # ~15 MB, not committed. The playground degrades to the console without it.
        run: bash tools/fetch-surfer.sh || echo "no Surfer bundle, playground ships without the viewer"

      - name: Check the playground examples
        run: |
          cmake -S . -B build -DBUILD_PYTHON_MODULE=OFF -DENABLE_TESTS=OFF
          cmake --build build --target wal -j"$(nproc)"
          python3 tools/check-examples.py build/wal

      - name: Build
        run: make docs

      - uses: actions/upload-artifact@v4
        with:
          name: walpp-docs
          path: build/site
          retention-days: 90
