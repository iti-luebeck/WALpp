# Package job for CentOS Stream 9
package:centos9:
  stage: package
  image: quay.io/centos/centos:stream9
  dependencies:
    - build:linux
  before_script:
    - dnf install -y epel-release
    - dnf install -y cmake gcc-c++ readline-devel python3-devel python3-pip rpm-build file
    - pip3 install pybind11
  script:
    - cd ${BUILD_DIR}
    - cpack -G RPM
    - rpm -qip walpp*.rpm
  artifacts:
    name: "walpp-centos9-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${BUILD_DIR}/walpp*.rpm
    expire_in: 4 weeks
  only:
    - main
    - tags

