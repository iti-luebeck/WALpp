stages:
  - build
  - test
  - package
  - wheel
  - docs

variables:
  CMAKE_BUILD_TYPE: Release
  BUILD_DIR: build

# Build job for Linux
build:linux:
  stage: build
  image: gcc:latest
  before_script:
    - apt-get update -qq
    - apt-get install -y cmake libedit-dev zlib1g-dev python3-dev python3-pip
    - pip3 install --break-system-packages pybind11
  script:
    - mkdir -p ${BUILD_DIR}
    - cd ${BUILD_DIR}
    - pybind11_DIR=$(pybind11-config --cmakedir) cmake .. -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} -DBUILD_PYTHON_MODULE=ON -DENABLE_TESTS=ON
    - cmake --build . -j$(nproc)
  artifacts:
    name: "walpp-linux-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${BUILD_DIR}/wal
      - ${BUILD_DIR}/lib*.so*
      - ${BUILD_DIR}/**/*.so
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - ${BUILD_DIR}/

# Test job for Linux
test:linux:
  stage: test
  image: gcc:latest
  dependencies:
    - build:linux
  before_script:
    - apt-get update -qq
    - apt-get install -y cmake libedit-dev zlib1g-dev python3-dev python3-pip
    - pip3 install --break-system-packages pybind11
  script:
    - cd ${BUILD_DIR}
    - ctest --output-on-failure -j$(nproc)
  artifacts:
    when: on_failure
    paths:
      - ${BUILD_DIR}/Testing/Temporary/
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - ${BUILD_DIR}/
    policy: pull

# Package job for Ubuntu 22.04
package:ubuntu22:
  stage: package
  image: ubuntu:22.04
  dependencies:
    - build:linux
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y cmake libedit-dev zlib1g-dev python3-dev python3-pip file dpkg-dev
    - pip3 install pybind11
  script:
    - pybind11_DIR=$(pybind11-config --cmakedir) cmake -S . -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} -DBUILD_PYTHON_MODULE=ON -DENABLE_TESTS=OFF
    - cmake --build ${BUILD_DIR} -j$(nproc)
    - cd ${BUILD_DIR}
    - cpack -G DEB
    - dpkg -I walpp*.deb
  artifacts:
    name: "walpp-ubuntu22-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${BUILD_DIR}/walpp*.deb
    expire_in: 4 weeks
  only:
    - main
    - tags

