# Package job for CentOS Stream 9
package:centos9:
  stage: package
  image: quay.io/centos/centos:stream9
  dependencies:
    - build:linux
  before_script:
    - dnf install -y epel-release dnf-plugins-core
    - dnf config-manager --set-enabled crb   # libedit-devel lives in CRB
    - dnf install -y cmake gcc-c++ libedit-devel zlib-devel python3-devel python3-pip rpm-build file
    - pip3 install pybind11
  script:
    - pybind11_DIR=$(pybind11-config --cmakedir) cmake -S . -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} -DBUILD_PYTHON_MODULE=ON -DENABLE_TESTS=OFF
    - cmake --build ${BUILD_DIR} -j$(nproc)
    - cd ${BUILD_DIR}
    - cpack -G RPM
    - rpm -qip walpp*.rpm
  artifacts:
    name: "walpp-centos9-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${BUILD_DIR}/walpp*.rpm
    expire_in: 4 weeks
  only:
    - main
    - tags

