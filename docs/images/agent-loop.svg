<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img"
     aria-labelledby="t7 d7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t7">Driving WAL++ from a program</title>
  <desc id="d7">Four steps. Inspect the trace for the exact signal names, write a query
  against those names, lint the script, then run it and read the envelope. Every step
  answers in the same envelope, so one check on the ok field covers all of them. A
  wrong name caught at inspect costs nothing. The same wrong name caught after the run
  costs a plausible number that nobody questions.</desc>

  <style>
    .bg    { fill: #ffffff; }
    .fg    { fill: #16202e; }
    .dim   { fill: #5a6779; }
    .faint { fill: #8d98a8; }
    .rule  { stroke: #dfe4ec; stroke-width: 1; }
    .box   { fill: #f7f8fa; stroke: #dfe4ec; }
    .key   { fill: #e6edfb; stroke: #9cbcf0; }
    .warn  { fill: #fdf0e3; stroke: #e8b982; }
    .arrow { stroke: #8d98a8; stroke-width: 1.5; fill: none; }
    .flow  { stroke: #1d5fd0; stroke-width: 1.5; fill: none; }
    .num   { fill: #1d5fd0; }
    .amber { fill: #9a5f12; }
    .mono  { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; }
    .small { font-size: 11px; }
    .h     { font-size: 12px; font-weight: 600; }
    .cap   { font-size: 14px; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0e141d; }
      .fg    { fill: #e4e9f1; }
      .dim   { fill: #a2aec0; }
      .faint { fill: #76829a; }
      .rule  { stroke: #263142; }
      .box   { fill: #151d29; stroke: #263142; }
      .key   { fill: #1a2740; stroke: #3b5a8c; }
      .warn  { fill: #2c2214; stroke: #7a5a28; }
      .arrow { stroke: #76829a; }
      .flow  { stroke: #74a4f5; }
      .num   { fill: #74a4f5; }
      .amber { fill: #e0ab63; }
    }

    /* The envelope band pulses under all four, because that is the point: one shape,
       whichever step answered. */
    .band { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

    /* Each step lights in turn, so the four read as an order rather than a row. */
    .step { animation: lift 8s ease-in-out infinite; }
    .s2 { animation-delay: 2s; } .s3 { animation-delay: 4s; } .s4 { animation-delay: 6s; }
    @keyframes lift {
      0%, 22%, 100% { opacity: .45; }
      5%, 18%       { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .band, .step { animation: none; opacity: 1; }
    }
  </style>

  <rect class="bg" width="760" height="392"/>

  <text class="fg cap" x="28" y="32">Driving WAL++ from a program</text>
  <text class="dim small" x="28" y="50">ask what is there, then build the query from what it told you</text>

  <!-- step 1 -->
  <g class="step s1">
    <text class="num h" x="34" y="104">1</text>
    <rect class="key" x="28" y="112" width="152" height="78" rx="5"/>
    <text class="fg h" x="42" y="134">Ask the trace</text>
    <text class="num mono" x="42" y="153">wal inspect</text>
    <text class="faint small" x="42" y="171">exact names, widths,</text>
    <text class="faint small" x="42" y="184">separators, length</text>
  </g>

  <path class="flow" d="M 186 151 H 214" marker-end="url(#ar4)"/>

  <!-- step 2 -->
  <g class="step s2">
    <text class="num h" x="214" y="104">2</text>
    <rect class="box" x="208" y="112" width="152" height="78" rx="5"/>
    <text class="fg h" x="222" y="134">Build the query</text>
    <text class="dim mono" x="222" y="153">name, verbatim</text>
    <text class="faint small" x="222" y="171">never rebuilt from</text>
    <text class="faint small" x="222" y="184">scope and leaf</text>
  </g>

  <path class="flow" d="M 366 151 H 394" marker-end="url(#ar4)"/>

  <!-- step 3 -->
  <g class="step s3">
    <text class="num h" x="394" y="104">3</text>
    <rect class="key" x="388" y="112" width="152" height="78" rx="5"/>
    <text class="fg h" x="402" y="134">Check it parses</text>
    <text class="num mono" x="402" y="153">wal lint</text>
    <text class="faint small" x="402" y="171">non-zero exit if it</text>
    <text class="faint small" x="402" y="184">will not run at all</text>
  </g>

  <path class="flow" d="M 546 151 H 574" marker-end="url(#ar4)"/>

  <!-- step 4 -->
  <g class="step s4">
    <text class="num h" x="574" y="104">4</text>
    <rect class="box" x="568" y="112" width="164" height="78" rx="5"/>
    <text class="fg h" x="582" y="134">Run and read</text>
    <text class="dim mono" x="582" y="153">wal run · wal eval</text>
    <text class="faint small" x="582" y="171">branch on ok, match</text>
    <text class="faint small" x="582" y="184">on error.code</text>
  </g>

  <!-- the envelope band under all four -->
  <g class="band">
    <rect class="box" x="28" y="206" width="704" height="34" rx="5"/>
    <text class="dim small" x="44" y="228">one envelope for all four:</text>
    <text class="fg mono" x="196" y="228">envelope_version · tool · command · source.age_seconds · ok · data · error</text>
  </g>

  <line class="rule" x1="28" y1="266" x2="732" y2="266"/>

  <!-- the point -->
  <rect class="warn" x="28" y="286" width="340" height="80" rx="5"/>
  <text class="amber h" x="44" y="308">Skip step 1</text>
  <text class="dim small" x="44" y="328">and a guessed signal name resolves to nothing,</text>
  <text class="dim small" x="44" y="344">the query still runs, and the answer is a number</text>
  <text class="dim small" x="44" y="360">in the right range that nobody questions.</text>

  <rect class="box" x="392" y="286" width="340" height="80" rx="5"/>
  <text class="fg h" x="408" y="308">Skip step 3</text>
  <text class="dim small" x="408" y="328">and a typo on line 90 is found after lines 1 to 89</text>
  <text class="dim small" x="408" y="344">have already written their output. Linting is the</text>
  <text class="dim small" x="408" y="360">only check that happens before anything runs.</text>

  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5fd0"/>
    </marker>
  </defs>
</svg>
