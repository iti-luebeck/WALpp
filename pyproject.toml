[build-system]
requires = [
  "scikit-build-core>=0.9",
  "cmake>=3.20",
  "ninja>=1.10",
  "pybind11>=2.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "walpp"
version = "1.6.4"
description = "WAL++: Waveform Analysis Language (C++20) with Python bindings"
readme = "README.md"
authors = [
  { name = "Rolf Meyer", email = "r.meyer@uni-luebeck.de" },
  { name = "Andrija Neskovic", email = "andrija.neskovic@uni-luebeck.de" },
]
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: C++",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/iti-luebeck/WALpp"
Documentation = "https://www.iti.uni-luebeck.de/docs/walpp/"
"Original WAL" = "https://wal-lang.org"
Issues = "https://github.com/iti-luebeck/WALpp/issues"

[project.scripts]
wal = "walpp._cli:main"

[tool.scikit-build]
# Pass CMake options to enable Python module build
cmake.args = [
  "-DBUILD_PYTHON_MODULE=ON",
  "-DENABLE_TESTS=OFF",
  # Link libwalpp statically into the extension and the CLI, so the wheel
  # does not depend on a separate libwalpp.so
  "-DBUILD_SHARED_LIBS=OFF",
  "-DCMAKE_POSITION_INDEPENDENT_CODE=ON",
]

# Ensure install passes through so the extension lands under walpp/
wheel.packages = ["src/walpp"]

